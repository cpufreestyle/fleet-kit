<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZCode captcha relay</title>
<script>window.AliyunCaptchaConfig={region:'cn',prefix:'no8xfe'};</script>
<script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
<style>
body{font-family:-apple-system,PingFang SC,sans-serif;padding:28px;max-width:720px}
h3{margin:0 0 6px}
p{color:#666;font-size:13px;line-height:1.6}
#cap{min-height:44px}
#verify{margin:14px 0 4px;padding:10px 26px;font-size:15px;border:0;border-radius:8px;background:#1677ff;color:#fff;cursor:pointer}
#verify:disabled{background:#a9c7ff;cursor:default}
#out{margin-top:18px;padding:12px;background:#f5f5f5;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h3>ZCode 反代理 · captcha 换取</h3>
<p>点「开始验证」完成一次滑块，票据自动存进桥接器的票池；<b>可以连续换几张备着</b>，
调用会从池里静默取票，池干了才需要再来本页。页面试探性自动唤起已去掉——不点就不弹。<br>
上游每次调用消耗一张票，票据 15 分钟内有效，一次多换几张即可覆盖一段时间的调用。</p>
<div id="cap"></div>
<button id="verify" type="button">开始验证</button>
<pre id="out">status: idle</pre>
<script>
var out=document.getElementById('out');
var verifyBtn=document.getElementById('verify');
var banked=0, pool=0;
function log(s){out.textContent='status: '+s;}
function refreshPool(){
  return fetch('/status').then(function(r){return r.json();}).then(function(j){
    pool=j.tickets||0;
    if(banked) log('已存 '+banked+' 张，池内共 '+pool+' 张；可以再点「开始验证」继续备票');
  }).catch(function(){});
}
function start(){
  if(window.__capInst && typeof window.__capInst.startTracelessVerification==='function'){
    window.__capInst.startTracelessVerification();
    log('验证中…');
  }else{
    log('SDK 未就绪，稍候再点');
  }
}
verifyBtn.addEventListener('click', function(){ start(); });
try{
  var inst=window.initAliyunCaptcha({
    SceneId:'11xygtvd',
    mode:'popup',
    language:'cn',
    showErrorTip:true,
    element:'#cap',
    getInstance:function(i){
      window.__capInst=i;
      log('ready — 点「开始验证」换票');
      refreshPool();
    },
    success:function(param){
      banked+=1;
      log('验证通过，正在存入票池…');
      fetch('/save',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'p='+encodeURIComponent(param||'')})
        .then(function(r){return r.text();}).then(function(t){
          log('saved('+t+') len='+(param||'').length);
          document.title='CAP-OK';
          refreshPool();
        })
        .catch(function(e){log('save-failed '+e.message+' (param len='+(param||'').length+')');});
    },
    fail:function(err){log('fail '+(err&&err.message?err.message:JSON.stringify(err)));},
    onError:function(err){log('error '+(err&&err.message?err.message:JSON.stringify(err)));}
  });
}catch(e){log('init-threw '+e.message);}
</script>
</body>
</html>
