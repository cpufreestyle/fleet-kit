name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n every shell script
        run: |
          fail=0
          while IFS= read -r f; do
            printf "== %s\n" "$f"
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(find . -name "*.sh" -not -path "./.git/*" -type f | sort)
          exit $fail

      - name: python syntax check
        run: python3 -m compileall -q bridges tools opencodex

      # The catalog tools decide which model rows get hidden, so their safety
      # gates (stale-snapshot refusal, never dropping a bridged provider,
      # bounding backup growth) are covered here rather than found live.
      - name: tools unit tests
        run: |
          python3 -m pip install --quiet pytest httpx fastapi
          python3 -m pytest tools -q

      - name: secret and PII leak scan
        run: |
          hits=0
          for pattern in "sk-[0-9a-f]{32,}" "ghp_[0-9A-Za-z]{20,}" "[A-Za-z0-9._%+-]+@(gmail|qq)[.]com" "/Users/[A-Za-z0-9._-]+" "BEGIN [A-Z ]*PRIVATE KEY"; do
            out=$(grep -rEn "$pattern" . --exclude-dir=.git || true)
            if [ -n "$out" ]; then
              echo "::error::possible leak matched: $pattern"
              printf "%s\n" "$out"
              hits=1
            fi
          done
          exit $hits

  # FleetKit ships one bash API for three service backends (launchd / schtasks /
  # supervisor). Each runner proves the matching backend is the one selected and
  # that the service helpers stay callable, so a platform regression fails here
  # instead of on someone's machine.
  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: detect backend
        shell: bash
        run: |
          # shellcheck source=tools/platform.sh
          . tools/platform.sh
          detected="$(fleet_os)"
          echo "detected: $detected"
          case "${{ matrix.os }}" in
            macos-latest)   [ "$detected" = "macos" ]   || exit 1 ;;
            windows-latest) [ "$detected" = "windows" ] || exit 1 ;;
            ubuntu-latest)  [ "$detected" = "linux" ]   || exit 1 ;;
          esac

      - name: service dir and python resolution
        shell: bash
        run: |
          # shellcheck source=tools/platform.sh
          . tools/platform.sh
          echo "service dir: $(fleet_service_dir)"
          echo "log dir    : $(fleet_log_dir)"
          echo "python     : $(fleet_system_python)"
          [ -n "$(fleet_service_dir)" ] || exit 1
          "$(fleet_system_python)" -c 'import sys; print(sys.version)'

      - name: port probe works without lsof
        shell: bash
        run: |
          # shellcheck source=tools/platform.sh
          . tools/platform.sh

          # A port nobody listens on must read as free, or a live fleet looks
          # dead to install/deploy checks.
          fleet_port_in_use 18924 && { echo "port probe reported a free port as busy"; exit 1; }
          echo "free-port verdict ok"

          # The busy verdict needs a listener the runner will keep. Starting a
          # background http.server does not work on the GitHub macOS runner:
          # the process stays alive, its log stays empty, and lsof reports the
          # socket as 127.0.0.1:18923 (CLOSED) -- the runner closes the
          # listening socket of anything a step started behind its back. So the
          # socket is held by this step's own foreground python, which the
          # runner's process tree is attached to, and the shell helper is asked
          # to classify it from outside.
          "$(fleet_system_python)" - <<'PY'
          import os
          import socket
          import subprocess
          import sys

          def bash_binary():
              # On Windows the `bash` that wins PATH lookup is wsl.exe's
              # launcher, which cannot run a POSIX script at all; the step
              # itself runs under Git for Windows bash, so ask for that one.
              if sys.platform.startswith("win"):
                  roots = [os.environ.get("ProgramFiles", r"C:\Program Files"),
                           os.environ.get("ProgramFiles(x86)", r"C:\Program Files (x86)")]
                  for root in roots:
                      cand = os.path.join(root, "Git", "bin", "bash.exe")
                      if os.path.exists(cand):
                          return cand
              return "bash"

          def verdict(port):
              # Relative source path from inside the workspace: a checkout
              # path can hold spaces and backslashes alike.
              script = ". ./tools/platform.sh; fleet_port_in_use {}".format(port)
              return subprocess.call(
                  [bash_binary(), "-c", script],
                  cwd=os.environ.get("GITHUB_WORKSPACE", "."))

          port = 18923
          holder = socket.socket()
          holder.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          holder.bind(("127.0.0.1", port))
          holder.listen(1)

          try:
              busy = verdict(port)
          finally:
              holder.close()

          if busy != 0:
              print("port probe missed a listening port held by this step")
              sys.exit(1)

          if verdict(18924) == 0:
              print("port probe reported a free port as busy")
              sys.exit(1)

          print("busy-port verdict ok")
          PY
          echo "port probe ok"

      - name: python platform module agrees
        shell: bash
        run: |
          cd tools
          "$(python3 -c 'import sys; print(sys.executable)')" - <<'PY'
          import fleet_platform as fp
          print("os:", fp.os_name())
          print("service dir:", fp.service_dir())
          print("log dir:", fp.log_dir())
          print("ports:", sorted(fp.service_ports().items())[:3])
          print("venv python:", fp.venv_python("."))
          PY

      - name: install plan is dry-run safe
        shell: bash
        run: |
          # a dry run must never touch a service backend or a home directory
          bash install.sh --dry-run --skip-deps --no-opencodex >/dev/null || {
            echo "install.sh --dry-run failed"; exit 1; }
          echo "dry run ok"
